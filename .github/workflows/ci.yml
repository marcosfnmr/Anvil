name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.lock
            backend/requirements.lock
            plc/requirements.lock

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.lock -r plc/requirements.lock

      - name: Compile Python sources
        run: python -m compileall -q backend plc integration test_manual.py

      - name: Run unit tests
        run: |
          python -m unittest discover -s plc/tests -v
          python -m unittest discover -s backend/tests -v

      - name: Build runtime images
        run: |
          docker build -t anvil/plc-s7:ci ./plc
          docker build -t anvil/backend:ci ./backend

      - name: Start the S7 integration target
        run: |
          PLC_CONFIG="$(python -c 'import json; print(json.dumps(json.load(open("example_config.json"))))')"
          docker run -d --name anvil-ci-plc -p 1102:102 -e PLC_CONFIG="$PLC_CONFIG" anvil/plc-s7:ci

      - name: Exercise the S7 protocol
        run: python integration/s7_smoke.py --port 1102

      - name: Show PLC logs on failure
        if: failure()
        run: docker logs anvil-ci-plc || true

      - name: Remove integration target
        if: always()
        run: docker rm -f anvil-ci-plc || true
